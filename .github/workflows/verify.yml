name: Verify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run optional GitHub live diagnostics gate
        run: npm run github:diagnose

      - name: Run tests, build and smoke checks
        run: npm run verify

  desktop-verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run desktop static smoke
        run: npm run build && node scripts/desktop-smoke.mjs

      - name: Run Electron boot smoke
        run: npm run build && node scripts/electron-smoke-launch.mjs

      - name: Run Electron user flow
        run: npm run desktop:flow
        env:
          CTX_LAB_ELECTRON_FLOW_SCREENSHOT: electron-flow-screenshot.png
          CTX_LAB_ELECTRON_FLOW_SCREENSHOT_METRICS: electron-flow-screenshot-metrics.json

      - name: Upload Electron flow screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-flow-screenshot
          path: |
            electron-flow-screenshot.png
            electron-flow-screenshot-metrics.json
          if-no-files-found: ignore

      - name: Run packaged app smoke
        run: npm run desktop:pack:smoke

      - name: Run Windows launcher dry-run
        shell: pwsh
        run: .\scripts\start-windows.ps1 -DryRun -SkipInstall
