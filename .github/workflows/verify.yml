name: Verify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests, build and smoke checks
        run: npm run verify

  desktop-verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run desktop static smoke
        run: npm run build && node scripts/desktop-smoke.mjs

      - name: Run Electron boot smoke
        run: npm run build && node scripts/electron-smoke-launch.mjs

      - name: Run Electron user flow
        run: npm run desktop:flow

      - name: Run Windows launcher dry-run
        shell: pwsh
        run: .\scripts\start-windows.ps1 -DryRun -SkipInstall
